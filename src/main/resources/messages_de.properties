checklist.break100.1.name=Günstige Bälle
checklist.break100.1.desc=Spiele günstige Golfbälle, ein Euro pro Ball reicht auf diesem Niveau. Von teuren Bällen profitierst du nicht - du verlierst noch zu viele davon.
checklist.break100.2.name=Griff verbessern
checklist.break100.2.desc=Bevor du Zeit in anderes wie deinen Schwung steckst: prüfe und lerne den richtigen Griff.
checklist.break100.3.name=Ein Turnier gewinnen (netto)
checklist.break100.3.desc=An einem guten Tag kannst du ein Clubturnier gewinnen.
checklist.break100.4.name=Ohne Driver spielen
checklist.break100.4.desc=Beherrsche deine Eisen. Spiele ohne Driver und ohne Holz 3. Du kannst die 100 auch ohne Driver knacken.
checklist.break100.5.name=Konstanter 145-Meter-Schlag
checklist.break100.5.desc=145 Meter Carry reichen völlig. Mit welchem Schläger auch immer - das genügt, um die 100 zu knacken.
checklist.break100.6.name=Kurzes Spiel verbessern
checklist.break100.6.desc=Fortschritte im kurzen Spiel sind der schnellste Weg zu einem niedrigeren Handicap. Fang mit dem Short-Game-HCP an.
checklist.break100.7.name=Kurze Putts
checklist.break100.7.desc=1-Meter-Putts mit über 90% Trefferquote, jedes Mal.
checklist.break100.8.name=Vor dem Spiel aufwärmen
checklist.break100.8.desc=Lerne eine gute Aufwärmroutine, damit die Gelenke geschmiert und die Muskeln locker sind.
checklist.break100.9.name=Erst auf die Range
checklist.break100.9.desc=Ein Korb Rangebälle ist billiger als zwei verlorene Bälle auf dem Platz.
checklist.break100.10.name=Kenne deine Längen
checklist.break100.10.desc=Ermittle die Carry-Längen deiner Schläger vom Tee.
checklist.break100.11.name=Entfernungen einschätzen lernen
checklist.break100.11.desc=Lerne, die Entfernung für deinen Schlag abzuschätzen.
checklist.break100.12.name=Viele Runden unter 100 spielen
checklist.break100.12.desc=Wenn du die 100 knackst, nimm die 90 ins Visier.
checklist.break100.21.name=Verlorene Bälle pro Runde zählen
checklist.break100.21.desc=Verlorene Bälle und Strafschläge sind die wichtigste Kennzahl, um die 100 zu knacken.
checklist.break90.13.name=Konstanter 150-Meter-Schlag
checklist.break90.13.desc=Carry. Mit welchem Schläger auch immer - das genügt, um die 90 zu knacken.
checklist.break90.14.name=Kurzes Spiel verbessern
checklist.break90.14.desc=Mach beim Short-Game-HCP weiter.
checklist.break90.15.name=Konstanz ist König
checklist.break90.15.desc=Starte mit Konstanz-Spielen auf der Range und auf den Grüns.
checklist.break90.16.name=Preshot-Routine
checklist.break90.16.desc=Preshot-Routine, jedes Mal. Ich sagte: jedes Mal. Fang mit einer einfachen an.
checklist.break90.17.name=Spielstatistik sammeln
checklist.break90.17.desc=Erkenne deine Schwächen.
checklist.break90.18.name=Viele Runden unter 90 spielen
checklist.break90.18.desc=Wenn du die 90 knackst, nimm die 80 ins Visier.
checklist.break90.22.name=Doppelbogeys pro Runde zählen
checklist.break90.22.desc=Doppelbogeys pro Runde sind die wichtigste Kennzahl, um die 90 zu knacken.
checklist.break90.23.name=Keine Heldenschläge
checklist.break90.23.desc=Heldenschläge produzieren Doppelbogeys.
checklist.break80.19.name=Viele Runden unter 80 spielen
checklist.break80.19.desc=Wenn du die 80 knackst, bist du bereit für die Clubmeisterschaft.
checklist.break80.20.name=Schläger anpassen lassen
checklist.break80.20.desc=Mit angepassten Schlägern (Fitting) verfeinerst du deine Ergebnisse.
