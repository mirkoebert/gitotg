goal.break80.title=Break 80
checklist.break100.1.name=Cheap balls
checklist.break100.1.desc=Play cheap golf balls, one buck per ball is fine at this level. You don't benefit from expensive balls - you are still losing too many of them.
checklist.break100.2.name=Improve your grip
checklist.break100.2.desc=Before you invest time in other things like your swing, check and learn the right grip.
checklist.break100.3.name=Win a tournament (net)
checklist.break100.3.desc=On a good day you are capable of winning a club tournament.
checklist.break100.4.name=Play without driver
checklist.break100.4.desc=Master your irons. Play without driver or 3 wood. You can break 100 without a driver.
checklist.break100.5.name=Consistent 150 yard shot
checklist.break100.5.desc=150 yards of carry is all you need. Whatever club it takes, it is enough to break 100.
checklist.break100.6.name=Improve your short game
checklist.break100.6.desc=Short game improvements are the fastest way to lower your handicap. Start with the short game HCP.
checklist.break100.7.name=Short putts
checklist.break100.7.desc=1 yard putts with a consistency above 90%, every time.
checklist.break100.8.name=Warm up before playing
checklist.break100.8.desc=Learn a good warmup routine to get juice in the joints and to loosen your muscles.
checklist.break100.9.name=Range first
checklist.break100.9.desc=One bucket of range balls is cheaper than losing two balls on the course.
checklist.break100.10.name=Know your distances
checklist.break100.10.desc=Get the carry distances of your clubs from the tee.
checklist.break100.11.name=Learn to judge distances
checklist.break100.11.desc=Learn to estimate the distance for your shot.
checklist.break100.12.name=Play many rounds under 100
checklist.break100.12.desc=If you break 100, then go for breaking 90.
checklist.break100.21.name=Count your lost balls per round
checklist.break100.21.desc=Lost balls and penalties are the most important metric to break 100.
checklist.break90.13.name=Consistent 160 yard shot
checklist.break90.13.desc=Carry. Whatever club it takes, it is enough to break 90.
checklist.break90.14.name=Improve your short game
checklist.break90.14.desc=Keep going with the short game HCP.
checklist.break90.15.name=Consistency is king
checklist.break90.15.desc=Start with consistency games on the range and on the greens.
checklist.break90.16.name=Preshot routine
checklist.break90.16.desc=Preshot routine, every time. I said: every time. Start with a simple one.
checklist.break90.17.name=Collect game statistics
checklist.break90.17.desc=Identify your weaknesses.
checklist.break90.18.name=Play many rounds under 90
checklist.break90.18.desc=If you break 90, then go for breaking 80.
checklist.break90.22.name=Count your double bogeys per round
checklist.break90.22.desc=Double bogeys per round are the most important metric to break 90.
checklist.break90.23.name=No hero shots
checklist.break90.23.desc=Hero shots create double bogeys.
checklist.break80.19.name=Play many rounds under 80
checklist.break80.19.desc=If you break 80, you are ready to win the club championship.
checklist.break80.20.name=Get fitted
checklist.break80.20.desc=Play with fitted golf clubs to fine tune your results.
