<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Simple Bootstrap Navbar -->
<nav class="navbar navbar-expand-lg bg-body-tertiary" th:fragment="navbar">
    <style>
        .lang-switch .lang-flag {
            font-size: 1.15rem;
            line-height: 1;
            opacity: 0.55;
            text-decoration: none;
            border-radius: 0.25rem;
        }

        .lang-switch .lang-flag:hover {
            opacity: 0.9;
        }

        .lang-switch .lang-flag.active {
            opacity: 1;
            outline: 2px solid rgba(13, 110, 253, 0.45);
            outline-offset: 2px;
        }
    </style>
    <div class="container-fluid">
        <!-- Brand/Logo -->
        <a class="navbar-brand" th:href="@{/}" th:text="#{nav.brand}">Gitotg</a>

        <!-- Toggler for mobile view -->
        <button aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler"
                data-bs-target="#navbarNav" data-bs-toggle="collapse" type="button">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Collapsible content -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/cockpit}" th:text="#{nav.cockpit}">Cockpit</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/timeline}" th:text="#{nav.timeline}">Timeline</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/handicap/input}" th:text="#{nav.handicap}">Handicap</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/gmetric}" th:text="#{nav.gmetric}">Metrics</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/golfcourse}" th:text="#{nav.golfcourse}">Golf Course</a>
                </li>
                <li class="nav-item dropdown">
                    <a aria-expanded="false" class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#"
                       role="button"
                       th:text="#{nav.goal}">
                        Goal
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/goal/break100}" th:text="#{nav.goal.break100}">Break
                            100</a></li>
                        <li><a class="dropdown-item" th:href="@{/goal/break90}" th:text="#{nav.goal.break90}">Break
                            90</a></li>
                        <li><a class="dropdown-item" th:href="@{/goal/break80}" th:text="#{nav.goal.break80}">Break
                            80</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/short-game-index}" th:text="#{nav.sgi}">Short Game Index</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}" th:text="#{nav.about}">About</a>
                </li>
            </ul>

            <!-- Auth actions on the right -->
            <ul class="navbar-nav ms-auto">
                <li class="nav-item d-flex align-items-center gap-1 me-2 lang-switch">
                    <a class="nav-link lang-flag py-0 px-1"
                       th:aria-current="${#locale.language == 'en'} ? 'true' : 'false'"
                       th:aria-label="#{nav.lang.en}"
                       th:classappend="${#locale.language == 'en'} ? 'active'"
                       th:href="@{''(lang=en)}"
                       th:title="#{nav.lang.en}">🇬🇧</a>
                    <a class="nav-link lang-flag py-0 px-1"
                       th:aria-current="${#locale.language == 'de'} ? 'true' : 'false'"
                       th:aria-label="#{nav.lang.de}"
                       th:classappend="${#locale.language == 'de'} ? 'active'"
                       th:href="@{''(lang=de)}"
                       th:title="#{nav.lang.de}">🇩🇪</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}" th:text="#{nav.login}">Login</a>
                </li>

                <li class="nav-item d-flex flex-wrap align-items-center gap-1" sec:authorize="isAuthenticated()">
                    <span class="navbar-text me-2 small text-muted text-truncate"
                          sec:authentication="principal.attributes['name']"
                          style="max-width: 12rem;">
                    </span>
                    <form class="d-inline" method="post" th:action="@{/logout}">
                        <button class="nav-link btn btn-link p-0 text-decoration-none"
                                th:text="#{nav.logout}"
                                type="submit">
                            Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
