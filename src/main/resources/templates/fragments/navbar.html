<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>

<!-- Simple Bootstrap Navbar -->
<nav class="navbar navbar-expand-lg bg-body-tertiary" th:fragment="navbar">
    <div class="container-fluid">
        <!-- Brand/Logo -->
        <a class="navbar-brand" th:href="@{/}" th:text="#{nav.brand}">Gitotg</a>

        <!-- Toggler for mobile view -->
        <button aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" class="navbar-toggler"
                data-bs-target="#navbarNav" data-bs-toggle="collapse" type="button">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Collapsible content -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/timeline}" th:text="#{nav.timeline}">Timeline</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user-page}" th:text="#{nav.user}">User</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/handicap/input}" th:text="#{nav.handicap}">Handicap</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"
                       th:text="#{nav.goal}">
                        Goal
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/goal/break100}" th:text="#{nav.goal.break100}">Break 100</a></li>
                        <li><a class="dropdown-item" th:href="@{/goal/break90}" th:text="#{nav.goal.break90}">Break 90</a></li>
                        <li><a class="dropdown-item" th:href="@{/goal/break80}" th:text="#{nav.goal.break80}">Break 80</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/short-game-index}" th:text="#{nav.sgi}">Short Game Index</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}" th:text="#{nav.about}">About</a>
                </li>
            </ul>

            <!-- Auth actions on the right -->
            <ul class="navbar-nav ms-auto">
                <li class="nav-item d-flex align-items-center gap-1 me-2">
                    <a class="nav-link py-0 px-1"
                       th:classappend="${#locale.language == 'en'} ? 'fw-bold'"
                       th:href="@{''(lang=en)}"
                       th:text="#{nav.lang.en}">EN</a>
                    <span class="text-muted">|</span>
                    <a class="nav-link py-0 px-1"
                       th:classappend="${#locale.language == 'de'} ? 'fw-bold'"
                       th:href="@{''(lang=de)}"
                       th:text="#{nav.lang.de}">DE</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}" th:text="#{nav.login}">Login</a>
                </li>

                <li sec:authorize="isAuthenticated()" class="nav-item d-flex flex-wrap align-items-center gap-1">
                    <span class="navbar-text me-2 small text-muted text-truncate"
                          style="max-width: 12rem;"
                          sec:authentication="principal.attributes['name']">
                    </span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit"
                                class="nav-link btn btn-link p-0 text-decoration-none"
                                th:text="#{nav.logout}">
                            Logout
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

</body>
</html>
