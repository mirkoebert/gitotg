<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{gmetric.title}">Gitotg: Golf Metrics</title>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:insert="~{fragments/head :: favicons}"></th:block>
    <style>
        .chart-wrap {
            position: relative;
            width: 100%;
            max-width: 100%;
            min-height: 220px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" defer></script>
</head>
<body class="container mt-3 mt-md-5">
<div th:insert="~{fragments/navbar :: navbar}"></div>

<h1 class="text-center mb-4" th:text="#{gmetric.heading}">Golf Metrics</h1>
<div class="row justify-content-center">
<div class="col-12 col-md-10 col-lg-8">
    <div class="d-flex justify-content-center mb-3">
        <div class="btn-group" role="group" th:aria-label="#{gmetric.range.label}">
            <button class="btn btn-outline-primary active" data-range="lastYear" id="range-lastYear"
                    th:text="#{gmetric.range.lastYear}" type="button">Last year
            </button>
            <button class="btn btn-outline-primary" data-range="all" id="range-all"
                    th:text="#{gmetric.range.all}" type="button">All
            </button>
        </div>
    </div>
    <div class="chart-wrap">
        <canvas id="lineChart"></canvas>
    </div>

<script th:inline="javascript">
    const chartTitle = /*[[#{gmetric.chartTitle}]]*/ 'Golf Metrics Monthly';
    const labelLostBalls = /*[[#{gmetric.type.lostBalls}]]*/ 'Lost Balls';
    const labelDoubleBogey = /*[[#{gmetric.type.doubleBogey}]]*/ 'Double Bogey';
    const labelBogey = /*[[#{gmetric.type.bogey}]]*/ 'Bogey';
    const chartDataUrl = /*[[@{/api/gmetric/chart-data}]]*/ '/api/gmetric/chart-data';

    let metricsChart = null;
    let currentRange = 'lastYear';
    let loadToken = 0;

    function smoothDataset(label, borderColor, backgroundColor) {
        return {
            label: label,
            data: [],
            borderColor: borderColor,
            backgroundColor: backgroundColor,
            borderWidth: 2.5,
            tension: 0.4,
            cubicInterpolationMode: 'monotone',
            fill: false,
            spanGaps: true,
            pointRadius: 2,
            pointHoverRadius: 5,
            pointHitRadius: 8
        };
    }

    function datasetTemplates() {
        return [
            smoothDataset(labelLostBalls, 'rgba(220, 53, 69, 1)', 'rgba(220, 53, 69, 0.15)'),
            smoothDataset(labelDoubleBogey, 'rgba(255, 193, 7, 1)', 'rgba(255, 193, 7, 0.15)'),
            smoothDataset(labelBogey, 'rgba(13, 110, 253, 1)', 'rgba(13, 110, 253, 0.15)')
        ];
    }

    function ensureChart() {
        if (metricsChart) {
            return metricsChart;
        }
        const ctx = document.getElementById('lineChart').getContext('2d');
        metricsChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: datasetTemplates()
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                animation: {
                    duration: 450,
                    easing: 'easeOutQuart'
                },
                elements: {
                    line: {
                        tension: 0.4,
                        cubicInterpolationMode: 'monotone',
                        borderJoinStyle: 'round',
                        borderCapStyle: 'round'
                    },
                    point: {
                        radius: 2,
                        hoverRadius: 5
                    }
                },
                plugins: {
                    legend: {position: 'top'},
                    title: {display: true, text: chartTitle}
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {precision: 0}
                    },
                    x: {
                        ticks: {
                            maxRotation: 0,
                            autoSkip: true,
                            maxTicksLimit: 12
                        }
                    }
                },
                interaction: {
                    mode: 'index',
                    intersect: false
                }
            }
        });
        return metricsChart;
    }

    function applyChartData(data) {
        const chart = ensureChart();
        chart.data.labels = data.labels || [];
        chart.data.datasets[0].data = data.lostBalls || [];
        chart.data.datasets[1].data = data.doubleBogey || [];
        chart.data.datasets[2].data = data.bogey || [];
        chart.update();
    }

    function setRangeButtonsEnabled(enabled) {
        document.querySelectorAll('[data-range]').forEach(btn => {
            btn.disabled = !enabled;
        });
    }

    function setActiveRangeButton(range) {
        document.querySelectorAll('[data-range]').forEach(btn => {
            const active = btn.getAttribute('data-range') === range;
            btn.classList.toggle('active', active);
            btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
    }

    async function loadChart(range) {
        const token = ++loadToken;
        setRangeButtonsEnabled(false);
        const url = chartDataUrl + (chartDataUrl.includes('?') ? '&' : '?') + 'range=' + encodeURIComponent(range);
        try {
            const response = await fetch(url, {
                method: 'GET',
                headers: {'Accept': 'application/json'},
                credentials: 'same-origin'
            });
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            const data = await response.json();
            // Ignore stale responses if user clicked another range quickly
            if (token !== loadToken) {
                return;
            }
            applyChartData(data);
        } catch (error) {
            console.error('Error loading gmetric chart for range ' + range + ':', error);
        } finally {
            if (token === loadToken) {
                setRangeButtonsEnabled(true);
            }
        }
    }

    function selectRange(range) {
        if (!range) {
            return;
        }
        currentRange = range;
        setActiveRangeButton(range);
        return loadChart(range);
    }

    document.querySelectorAll('[data-range]').forEach(btn => {
        btn.addEventListener('click', function (event) {
            event.preventDefault();
            selectRange(this.getAttribute('data-range'));
        });
    });

    selectRange(currentRange);
</script>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
