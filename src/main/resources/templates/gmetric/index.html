<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{gmetric.title}">Gitotg: Golf Metrics</title>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:insert="~{fragments/head :: favicons}"></th:block>
    <style>
        .chart-wrap {
            position: relative;
            width: 100%;
            max-width: 100%;
            min-height: 220px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" defer></script>
</head>
<body class="container mt-3 mt-md-5">
<div th:insert="~{fragments/navbar :: navbar}"></div>

<h1 class="text-center mb-4" th:text="#{gmetric.heading}">Golf Metrics</h1>

<ul class="list-group">
    <li class="list-group-item">
        <span th:text="#{gmetric.export}">Export:</span>
        <a th:href="@{/api/gmetric/export}" th:text="#{common.csv}">CSV</a>
    </li>
    <li class="list-group-item">
        <div class="d-flex flex-column flex-sm-row flex-wrap align-items-sm-center gap-2">
            <span th:text="#{common.import}">Import:</span>
            <form class="d-flex flex-column flex-sm-row flex-wrap align-items-stretch align-items-sm-center gap-2" enctype="multipart/form-data" id="gmetric-import-form"
                  method="post"
                  th:action="@{/api/gmetric/import}">
                <input accept=".csv" aria-describedby="gmetric-import-limits gmetric-import-hint" class="form-control form-control-sm" name="file" required style="max-width: 100%; width: min(100%, 220px);"
                       type="file">
                <button class="btn btn-primary btn-sm" th:text="#{common.upload}" type="submit">Upload</button>
            </form>
        </div>
        <small class="d-block mt-1 fw-semibold" id="gmetric-import-limits" th:text="#{common.importLimits}">Max 500 KB /
            420 lines</small>
        <small class="d-block mt-1 text-muted" id="gmetric-import-hint" th:text="#{gmetric.importHint}">(CSV with
            date,metricValue,type columns; replaces existing metrics; max 500KB / 420 lines)</small>
        <div class="mt-1 small" id="gmetric-import-status" style="display:none;"></div>
    </li>
</ul>

<div class="mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="d-flex justify-content-center mb-3">
                <div class="btn-group" role="group" th:aria-label="#{gmetric.range.label}">
                    <button class="btn btn-outline-primary active" data-range="lastYear" id="range-lastYear"
                            th:text="#{gmetric.range.lastYear}" type="button">Last year
                    </button>
                    <button class="btn btn-outline-primary" data-range="all" id="range-all"
                            th:text="#{gmetric.range.all}" type="button">All
                    </button>
                </div>
            </div>
            <div class="chart-wrap">
                <canvas id="lineChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const chartTitle = /*[[#{gmetric.chartTitle}]]*/ 'Golf Metrics Monthly';
    const labelLostBalls = /*[[#{gmetric.type.lostBalls}]]*/ 'Lost Balls';
    const labelDoubleBogey = /*[[#{gmetric.type.doubleBogey}]]*/ 'Double Bogey';
    const labelBogey = /*[[#{gmetric.type.bogey}]]*/ 'Bogey';
    const i18nUploading = /*[[#{common.uploading}]]*/ 'Uploading...';
    const i18nErrorPrefix = /*[[#{api.import.errorPrefix}]]*/ 'Error:';
    const i18nFailedPrefix = /*[[#{api.import.failedPrefix}]]*/ 'Upload failed:';
    const i18nFileTooLarge = /*[[#{api.import.fileTooLarge}]]*/ 'File too large. Maximum allowed size is 500KB.';
    const i18nTooManyLines = /*[[#{api.import.tooManyLines(420)}]]*/ 'Too many lines. Maximum allowed is 420 lines.';
    const chartDataUrl = /*[[@{/api/gmetric/chart-data}]]*/ '/api/gmetric/chart-data';

    let metricsChart = null;
    let currentRange = 'lastYear';
    let loadToken = 0;

    function smoothDataset(label, borderColor, backgroundColor) {
        return {
            label: label,
            data: [],
            borderColor: borderColor,
            backgroundColor: backgroundColor,
            borderWidth: 2.5,
            tension: 0.4,
            cubicInterpolationMode: 'monotone',
            fill: false,
            spanGaps: true,
            pointRadius: 2,
            pointHoverRadius: 5,
            pointHitRadius: 8
        };
    }

    function datasetTemplates() {
        return [
            smoothDataset(labelLostBalls, 'rgba(220, 53, 69, 1)', 'rgba(220, 53, 69, 0.15)'),
            smoothDataset(labelDoubleBogey, 'rgba(255, 193, 7, 1)', 'rgba(255, 193, 7, 0.15)'),
            smoothDataset(labelBogey, 'rgba(13, 110, 253, 1)', 'rgba(13, 110, 253, 0.15)')
        ];
    }

    function ensureChart() {
        if (metricsChart) {
            return metricsChart;
        }
        const ctx = document.getElementById('lineChart').getContext('2d');
        metricsChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: datasetTemplates()
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                animation: {
                    duration: 450,
                    easing: 'easeOutQuart'
                },
                elements: {
                    line: {
                        tension: 0.4,
                        cubicInterpolationMode: 'monotone',
                        borderJoinStyle: 'round',
                        borderCapStyle: 'round'
                    },
                    point: {
                        radius: 2,
                        hoverRadius: 5
                    }
                },
                plugins: {
                    legend: {position: 'top'},
                    title: {display: true, text: chartTitle}
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {precision: 0}
                    },
                    x: {
                        ticks: {
                            maxRotation: 0,
                            autoSkip: true,
                            maxTicksLimit: 12
                        }
                    }
                },
                interaction: {
                    mode: 'index',
                    intersect: false
                }
            }
        });
        return metricsChart;
    }

    function applyChartData(data) {
        const chart = ensureChart();
        chart.data.labels = data.labels || [];
        chart.data.datasets[0].data = data.lostBalls || [];
        chart.data.datasets[1].data = data.doubleBogey || [];
        chart.data.datasets[2].data = data.bogey || [];
        chart.update();
    }

    function setRangeButtonsEnabled(enabled) {
        document.querySelectorAll('[data-range]').forEach(btn => {
            btn.disabled = !enabled;
        });
    }

    function setActiveRangeButton(range) {
        document.querySelectorAll('[data-range]').forEach(btn => {
            const active = btn.getAttribute('data-range') === range;
            btn.classList.toggle('active', active);
            btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
    }

    async function loadChart(range) {
        const token = ++loadToken;
        setRangeButtonsEnabled(false);
        const url = chartDataUrl + (chartDataUrl.includes('?') ? '&' : '?') + 'range=' + encodeURIComponent(range);
        try {
            const response = await fetch(url, {
                method: 'GET',
                headers: {'Accept': 'application/json'},
                credentials: 'same-origin'
            });
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            const data = await response.json();
            // Ignore stale responses if user clicked another range quickly
            if (token !== loadToken) {
                return;
            }
            applyChartData(data);
        } catch (error) {
            console.error('Error loading gmetric chart for range ' + range + ':', error);
        } finally {
            if (token === loadToken) {
                setRangeButtonsEnabled(true);
            }
        }
    }

    function selectRange(range) {
        if (!range) {
            return;
        }
        currentRange = range;
        setActiveRangeButton(range);
        return loadChart(range);
    }

    document.querySelectorAll('[data-range]').forEach(btn => {
        btn.addEventListener('click', function (event) {
            event.preventDefault();
            selectRange(this.getAttribute('data-range'));
        });
    });

    selectRange(currentRange);
</script>

<div class="my-5">
    <h2 th:text="#{gmetric.addHeading}">Add Metric</h2>
    <form method="post" th:action="@{/gmetric/submit}" th:object="${gMetric}">
        <div class="row g-3 align-items-end">
            <div class="col-12 col-md-3" th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'">
                <label class="form-label" for="type" th:text="#{gmetric.typeLabel}">Type</label>
                <select class="form-select" id="type" required th:field="*{type}">
                    <option th:text="#{gmetric.type.lostBalls}" th:value="LOST_BALLS">Lost Balls</option>
                    <option th:text="#{gmetric.type.doubleBogey}" th:value="DOUBLE_BOGEY">Double Bogey</option>
                    <option th:text="#{gmetric.type.bogey}" th:value="BOGEY">Bogey</option>
                </select>
                <div class="text-danger small" th:errors="*{type}"></div>
            </div>
            <div class="col-12 col-md-3" th:classappend="${#fields.hasErrors('metricValue')} ? 'is-invalid'">
                <label class="form-label" for="metricValue" th:text="#{gmetric.valueLabel}">Value</label>
                <input class="form-control" id="metricValue" required step="1" th:field="*{metricValue}"
                       th:max="${T(com.mirkoebert.InputLimits).METRIC_MAX}"
                       th:min="${T(com.mirkoebert.InputLimits).METRIC_MIN}"
                       th:placeholder="#{gmetric.valuePlaceholder}" type="number">
                <div class="text-danger small" th:errors="*{metricValue}"></div>
            </div>
            <div class="col-12 col-md-3" th:classappend="${#fields.hasErrors('selectedDate')} ? 'is-invalid'">
                <label class="form-label" for="selectedDate" th:text="#{common.date}">Date</label>
                <input class="form-control" id="selectedDate" required th:field="*{selectedDate}" type="date">
                <div class="text-danger small" th:errors="*{selectedDate}"></div>
            </div>
            <div class="col-12 col-md-3">
                <button class="btn btn-primary" th:text="#{gmetric.addScore}" type="submit">Add Metric</button>
            </div>
        </div>
    </form>
</div>

<script src="/js/csv-import.js"></script>
<script>
    GitotgCsvImport.bindImportForm('gmetric-import-form', 'gmetric-import-status', {
        uploading: i18nUploading,
        errorPrefix: i18nErrorPrefix,
        failedPrefix: i18nFailedPrefix,
        fileTooLarge: i18nFileTooLarge,
        tooManyLines: i18nTooManyLines
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
