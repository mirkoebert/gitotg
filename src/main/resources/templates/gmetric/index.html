<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{gmetric.title}">Gitotg: Golf Metrics</title>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:insert="~{fragments/head :: favicons}"></th:block>
    <style>
        .chart-wrap {
            position: relative;
            width: 100%;
            max-width: 100%;
            min-height: 220px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
</head>
<body class="container mt-3 mt-md-5">
<div th:insert="~{fragments/navbar :: navbar}"></div>

<h1 class="text-center mb-4" th:text="#{gmetric.heading}">Golf Metrics</h1>

<ul class="list-group">
    <li class="list-group-item">
        <span th:text="#{gmetric.export}">Export:</span>
        <a th:href="@{/api/gmetric/export}" th:text="#{common.csv}">CSV</a>
    </li>
    <li class="list-group-item">
        <div class="d-flex flex-column flex-sm-row flex-wrap align-items-sm-center gap-2">
            <span th:text="#{common.import}">Import:</span>
            <form id="gmetric-import-form" method="post" th:action="@{/api/gmetric/import}" enctype="multipart/form-data"
                  class="d-flex flex-column flex-sm-row flex-wrap align-items-stretch align-items-sm-center gap-2">
                <input class="form-control form-control-sm" type="file" name="file" accept=".csv" required
                       style="max-width: 100%; width: min(100%, 220px);">
                <button type="submit" class="btn btn-primary btn-sm" th:text="#{common.upload}">Upload</button>
            </form>
        </div>
        <small class="d-block mt-1 text-muted" th:text="#{gmetric.importHint}">(CSV with date,metricValue,type columns; upserts by date+type; max 1MB)</small>
        <div id="gmetric-import-status" class="mt-1 small" style="display:none;"></div>
    </li>
</ul>

<div class="mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="chart-wrap">
                <canvas id="lineChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const chartTitle = /*[[#{gmetric.chartTitle}]]*/ 'Golf Metrics Monthly';
    const labelLostBalls = /*[[#{gmetric.type.lostBalls}]]*/ 'Lost Balls';
    const labelDoubleBogey = /*[[#{gmetric.type.doubleBogey}]]*/ 'Double Bogey';
    const labelBogey = /*[[#{gmetric.type.bogey}]]*/ 'Bogey';
    const i18nUploading = /*[[#{common.uploading}]]*/ 'Uploading...';
    const i18nErrorPrefix = /*[[#{api.import.errorPrefix}]]*/ 'Error:';
    const i18nFailedPrefix = /*[[#{api.import.failedPrefix}]]*/ 'Upload failed:';

    fetch(/*[[@{/api/gmetric/chart-data}]]*/ '/api/gmetric/chart-data')
        .then(response => response.json())
        .then(data => {
            const ctx = document.getElementById('lineChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [
                        {
                            label: labelLostBalls,
                            data: data.lostBalls,
                            borderColor: 'rgba(220, 53, 69, 1)',
                            backgroundColor: 'rgba(220, 53, 69, 0.2)',
                            tension: 0.5,
                            fill: false,
                            spanGaps: true
                        },
                        {
                            label: labelDoubleBogey,
                            data: data.doubleBogey,
                            borderColor: 'rgba(255, 193, 7, 1)',
                            backgroundColor: 'rgba(255, 193, 7, 0.2)',
                            tension: 0.5,
                            fill: false,
                            spanGaps: true
                        },
                        {
                            label: labelBogey,
                            data: data.bogey,
                            borderColor: 'rgba(13, 110, 253, 1)',
                            backgroundColor: 'rgba(13, 110, 253, 0.2)',
                            tension: 0.5,
                            fill: false,
                            spanGaps: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: chartTitle }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        })
        .catch(error => console.error('Error fetching data:', error));
</script>

<div class="my-5">
    <h2 th:text="#{gmetric.addHeading}">Add Metric</h2>
    <form method="post" th:action="@{/gmetric/submit}" th:object="${gMetric}">
        <div class="row g-3 align-items-end">
            <div class="col-12 col-md-3" th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'">
                <label class="form-label" for="type" th:text="#{gmetric.typeLabel}">Type</label>
                <select class="form-select" id="type" th:field="*{type}" required>
                    <option th:value="LOST_BALLS" th:text="#{gmetric.type.lostBalls}">Lost Balls</option>
                    <option th:value="DOUBLE_BOGEY" th:text="#{gmetric.type.doubleBogey}">Double Bogey</option>
                    <option th:value="BOGEY" th:text="#{gmetric.type.bogey}">Bogey</option>
                </select>
                <div class="text-danger small" th:errors="*{type}"></div>
            </div>
            <div class="col-12 col-md-3" th:classappend="${#fields.hasErrors('metricValue')} ? 'is-invalid'">
                <label class="form-label" for="metricValue" th:text="#{gmetric.valueLabel}">Value</label>
                <input class="form-control" id="metricValue" th:field="*{metricValue}" type="number" min="0" step="1"
                       th:placeholder="#{gmetric.valuePlaceholder}" required>
                <div class="text-danger small" th:errors="*{metricValue}"></div>
            </div>
            <div class="col-12 col-md-3" th:classappend="${#fields.hasErrors('selectedDate')} ? 'is-invalid'">
                <label class="form-label" for="selectedDate" th:text="#{common.date}">Date</label>
                <input class="form-control" id="selectedDate" th:field="*{selectedDate}" type="date" required>
                <div class="text-danger small" th:errors="*{selectedDate}"></div>
            </div>
            <div class="col-12 col-md-3">
                <button class="btn btn-primary" type="submit" th:text="#{gmetric.addScore}">Add Metric</button>
            </div>
        </div>
    </form>
</div>

<script>
(function() {
  const form = document.getElementById('gmetric-import-form');
  const statusEl = document.getElementById('gmetric-import-status');
  if (!form || !statusEl) return;

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = form.querySelector('button[type="submit"]');
    const originalText = btn ? btn.textContent : '';
    if (btn) {
      btn.disabled = true;
      btn.textContent = i18nUploading;
    }
    statusEl.style.display = 'none';
    statusEl.innerHTML = '';

    try {
      const formData = new FormData(form);
      const response = await fetch(form.action, {
        method: 'POST',
        body: formData
      });
      const text = await response.text();
      if (response.ok) {
        statusEl.innerHTML = '<span class="text-success">' + text + '</span>';
        setTimeout(function() { window.location.reload(); }, 1200);
      } else {
        statusEl.innerHTML = '<span class="text-danger">' + i18nErrorPrefix + ' ' + text + '</span>';
      }
    } catch (err) {
      statusEl.innerHTML = '<span class="text-danger">' + i18nFailedPrefix + ' ' + (err.message || err) + '</span>';
    } finally {
      statusEl.style.display = 'block';
      if (btn) {
        btn.disabled = false;
        btn.textContent = originalText;
      }
      const fileInput = form.querySelector('input[type="file"]');
      if (fileInput) fileInput.value = '';
    }
  });
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
