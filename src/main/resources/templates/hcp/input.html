<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{hcp.title}">Gitotg: Handicap</title>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:insert="~{fragments/head :: favicons}"></th:block>
    <style>
        .chart-wrap {
            position: relative;
            width: 100%;
            max-width: 100%;
            min-height: 220px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" defer></script>
</head>
<body class="container mt-3 mt-md-5">
<div th:insert="~{fragments/navbar :: navbar}"></div>

<h1 class="text-center mb-4" th:text="#{hcp.heading}">Handicap</h1>
<ul class="list-group">
    <li class="list-group-item"><span th:text="#{common.hcp}">HCP</span>: <span th:text="${lastResult.hcp}"></span></li>
    <li class="list-group-item"><span th:text="#{common.date}">Date</span>: <span th:text="${lastResult.date}"></span>
    </li>
    <li class="list-group-item"><span th:text="#{common.trend}">Trend</span>: <span
            th:text="${lastResult.trend}"></span></li>
    <li class="list-group-item"><span th:text="#{hcp.export}">Export:</span> <a th:href="@{/api/handicap/export}"
                                                                                th:text="#{common.csv}">CSV</a></li>
    <li class="list-group-item">
        <div class="d-flex flex-column flex-sm-row flex-wrap align-items-sm-center gap-2">
            <span th:text="#{common.import}">Import:</span>
            <form class="d-flex flex-column flex-sm-row flex-wrap align-items-stretch align-items-sm-center gap-2" enctype="multipart/form-data" id="hcp-import-form" method="post"
                  th:action="@{/api/handicap/import}">
                <input accept=".csv" aria-describedby="hcp-import-limits hcp-import-hint" class="form-control form-control-sm" name="file" required style="max-width: 100%; width: min(100%, 220px);"
                       type="file">
                <button class="btn btn-primary btn-sm" th:text="#{common.upload}" type="submit">Upload</button>
            </form>
        </div>
        <small class="d-block mt-1 fw-semibold" id="hcp-import-limits" th:text="#{common.importLimits}">Max 500 KB / 420
            lines</small>
        <small class="d-block mt-1 text-muted" id="hcp-import-hint" th:text="#{hcp.importHint}">(CSV with date,hcp
            columns; replaces data; max 500KB / 420 lines)</small>
        <div class="mt-1 small" id="hcp-import-status" style="display:none;"></div>
    </li>
</ul>


<div class="mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="d-flex justify-content-center mb-3">
                <div class="btn-group" role="group" th:aria-label="#{hcp.range.label}">
                    <button class="btn btn-outline-primary active" data-range="lastTwoYears" id="range-lastTwoYears"
                            th:text="#{hcp.range.lastTwoYears}" type="button">Last two years
                    </button>
                    <button class="btn btn-outline-primary" data-range="all" id="range-all"
                            th:text="#{hcp.range.all}" type="button">All
                    </button>
                </div>
            </div>
            <div class="chart-wrap">
                <canvas id="lineChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const hcpChartLabel = /*[[#{hcp.chartLabel}]]*/ 'HCP';
    const hcpChartTitle = /*[[#{hcp.chartTitle}]]*/ 'Handicap Monthly';
    const chartDataUrl = /*[[@{/api/handicap/chart-data}]]*/ '/api/handicap/chart-data';
    const i18nUploading = /*[[#{common.uploading}]]*/ 'Uploading...';
    const i18nErrorPrefix = /*[[#{api.import.errorPrefix}]]*/ 'Error:';
    const i18nFailedPrefix = /*[[#{api.import.failedPrefix}]]*/ 'Upload failed:';
    const i18nFileTooLarge = /*[[#{api.import.fileTooLarge}]]*/ 'File too large. Maximum allowed size is 500KB.';
    const i18nTooManyLines = /*[[#{api.import.tooManyLines(420)}]]*/ 'Too many lines. Maximum allowed is 420 lines.';

    let hcpChart = null;
    let currentRange = 'lastTwoYears';
    let loadToken = 0;

    function ensureChart() {
        if (hcpChart) {
            return hcpChart;
        }
        const ctx = document.getElementById('lineChart').getContext('2d');
        hcpChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: hcpChartLabel,
                    data: [],
                    borderColor: 'rgba(75, 192, 192, 1)',
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',
                    tension: 0.5,
                    fill: false,
                    connectNulls: true,
                    spanGaps: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {position: 'top'},
                    title: {display: true, text: hcpChartTitle}
                },
                scales: {
                    y: {beginAtZero: true},
                    x: {
                        ticks: {
                            maxRotation: 0,
                            autoSkip: true,
                            maxTicksLimit: 12
                        }
                    }
                }
            }
        });
        return hcpChart;
    }

    function applyChartData(data) {
        const chart = ensureChart();
        chart.data.labels = data.labels || [];
        chart.data.datasets[0].data = data.hcp || [];
        chart.update();
    }

    function setRangeButtonsEnabled(enabled) {
        document.querySelectorAll('[data-range]').forEach(btn => {
            btn.disabled = !enabled;
        });
    }

    function setActiveRangeButton(range) {
        document.querySelectorAll('[data-range]').forEach(btn => {
            const active = btn.getAttribute('data-range') === range;
            btn.classList.toggle('active', active);
            btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
    }

    async function loadChart(range) {
        const token = ++loadToken;
        setRangeButtonsEnabled(false);
        const url = chartDataUrl + (chartDataUrl.includes('?') ? '&' : '?') + 'range=' + encodeURIComponent(range);
        try {
            const response = await fetch(url, {
                method: 'GET',
                headers: {'Accept': 'application/json'},
                credentials: 'same-origin'
            });
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }
            const data = await response.json();
            if (token !== loadToken) {
                return;
            }
            applyChartData(data);
        } catch (error) {
            console.error('Error loading handicap chart for range ' + range + ':', error);
        } finally {
            if (token === loadToken) {
                setRangeButtonsEnabled(true);
            }
        }
    }

    function selectRange(range) {
        if (!range) {
            return;
        }
        currentRange = range;
        setActiveRangeButton(range);
        return loadChart(range);
    }

    document.querySelectorAll('[data-range]').forEach(btn => {
        btn.addEventListener('click', function (event) {
            event.preventDefault();
            selectRange(this.getAttribute('data-range'));
        });
    });

    selectRange(currentRange);
</script>
<div class="my-5">
    <h2 th:text="#{hcp.addHeading}">Add Handicap</h2>
    <form method="post" th:action="@{/handicap/submit}" th:object="${hcpScore}">
        <div class="row g-3 align-items-end">
            <div class="col-12 col-md-4" th:classappend="${#fields.hasErrors('hcp')} ? 'is-invalid'">
                <label class="form-label" for="hcp" th:text="#{hcp.label}">Handicap</label>
                <input class="form-control" id="hcp" required step="0.1" th:field="*{hcp}"
                       th:max="${T(com.mirkoebert.InputLimits).HCP_MAX}"
                       th:min="${T(com.mirkoebert.InputLimits).HCP_MIN}"
                       th:placeholder="#{hcp.placeholder}" type="number">
                <div class="text-danger small" th:errors="*{hcp}"></div>
            </div>
            <div class="col-12 col-md-4" th:classappend="${#fields.hasErrors('selectedDate')} ? 'is-invalid'">
                <label class="form-label" for="selectedDate" th:text="#{common.date}">Date</label>
                <input class="form-control" id="selectedDate" required th:field="*{selectedDate}" type="date">
                <div class="text-danger small" th:errors="*{selectedDate}"></div>
            </div>
            <div class="col-12 col-md-4">
                <button class="btn btn-primary" th:text="#{hcp.addScore}" type="submit">Add Score</button>
            </div>
        </div>
    </form>
</div>

<script src="/js/csv-import.js"></script>
<script>
    GitotgCsvImport.bindImportForm('hcp-import-form', 'hcp-import-status', {
        uploading: i18nUploading,
        errorPrefix: i18nErrorPrefix,
        failedPrefix: i18nFailedPrefix,
        fileTooLarge: i18nFileTooLarge,
        tooManyLines: i18nTooManyLines
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
