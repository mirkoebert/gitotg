<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{sgi.input.title}">Short Game Input</title>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:insert="~{fragments/head :: favicons}"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" defer></script>
    <style>
        .chart-wrap {
            position: relative;
            width: 100%;
            max-width: 100%;
            min-height: 220px;
        }
    </style>
</head>
<body class="container mt-3 mt-md-5">
<div th:insert="~{fragments/navbar :: navbar}"></div>


<h1 class="text-center mb-4"><span th:text="${sgitest.name}"></span></h1>

<ul class="list-group">
    <li class="list-group-item"><span th:text="#{sgi.distance}">Distance:</span> <span
            th:text="${sgitest.distanceMeterToCup}"></span>m
    </li>
    <li class="list-group-item" th:text="#{sgi.shots}">Shots: 10</li>
    <li class="list-group-item" th:text="#{sgi.holed}">Holed: 4 Points</li>
    <li class="list-group-item" th:text="#{sgi.in1m}">In 1m: 2 Points</li>
    <li class="list-group-item" th:text="#{sgi.in2m}">In 2m: 1 Point</li>
    <li class="list-group-item">
        <form class="row g-2 align-items-center" method="post" th:action="@{/submit}"
              th:object="${sgitest1score}">
            <input th:field="*{type}" type="hidden"/>
            <input th:field="*{testId}" type="hidden"/>

            <div class="col-12 col-sm-auto">
                <label class="col-form-label" for="points" th:text="#{sgi.pointsLabel}">Points:</label>
            </div>
            <div class="col-12 col-sm-auto">
                <input class="form-control" id="points" th:field="*{points}" type="number"/>
            </div>
            <div class="col-12 col-sm-auto">
                <button class="btn btn-primary" th:text="#{common.submit}" type="submit">Submit</button>
            </div>
        </form>
    </li>
    <li class="list-group-item"><span th:text="#{common.trend}">Trend:</span> <span th:text="${trend}"></span></li>

</ul>
<div class="mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="chart-wrap">
                <canvas id="lineChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const sgiChartLabel = /*[[#{common.hcp}]]*/ 'HCP';
    const sgiChartTitle = /*[[#{sgi.chartTitle}]]*/ 'HCP Monthly';

    // Fetch data from REST API and render chart
    fetch(/*[[@{/api/sgi/chart-data/{id}(id=${testId})}]]*/ '/api/sgi/chart-data')
        .then(response => response.json())
        .then(data => {
            const ctx = document.getElementById('lineChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [{
                        label: sgiChartLabel,
                        data: data.hcp,
                        borderColor: 'rgba(75, 192, 192, 1)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        tension: 0.5,
                        fill: false,
                        connectNulls: true,
                        spanGaps: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {position: 'top'},
                        title: {display: true, text: sgiChartTitle}
                    },
                    scales: {
                        y: {beginAtZero: true}
                    }
                }
            });
        })
        .catch(error => console.error('Error fetching data:', error));
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
