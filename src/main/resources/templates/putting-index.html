<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{putting.title}">Gitotg: Putting Index</title>
    <meta charset="UTF-8">
    <meta content="Mirko Ebert" name="author">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:insert="~{fragments/head :: favicons}"></th:block>
    <style>
        .not-implemented-image {
            max-width: 100%;
            height: auto;
            max-height: 420px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="container mt-3 mt-md-5">
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="text-center mt-5">
    <img src="/images/golf-glove.jpg"
         th:alt="#{putting.alt.glove}"
         class="not-implemented-image mb-4">

    <h1 class="display-5 mb-3" th:text="#{putting.heading}">Putting Index</h1>
    <p class="lead text-muted mb-4" th:text="#{putting.notImplemented}">Not implemented yet.</p>
    <a th:href="@{/}" class="btn btn-primary" th:text="#{putting.index}">Index</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
