<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{goal.titlePrefix} + ' ' + #{__${goalTitleKey}__}">Gitotg: Goal</title>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:insert="~{fragments/head :: favicons}"></th:block>
</head>
<body class="container mt-3 mt-md-5">
<div th:insert="~{fragments/navbar :: navbar}"></div>

<h1 class="text-center mb-4" th:text="#{__${goalTitleKey}__}">Goal</h1>

<div class="alert alert-success" role="alert" th:if="${saved}" th:text="#{goal.saved}">
    Checklist saved.
</div>

<div class="mb-4" th:if="${progress != null and !progress.empty}">
    <div class="d-flex justify-content-between align-items-baseline mb-1">
        <span class="fw-bold" th:text="#{goal.progress}">Progress</span>
        <span class="text-muted"
              th:text="#{goal.progressOf(${progress.checkedCount}, ${progress.totalCount}, ${progress.percentage})}">
            0 of 0 (0%)
        </span>
    </div>
    <div class="progress" role="progressbar"
         th:aria-label="#{goal.progressAria(${progress.percentage})}"
         th:attr="aria-valuenow=${progress.percentage}, aria-valuemin=0, aria-valuemax=100">
        <div class="progress-bar"
             th:classappend="${progress.percentage == 100} ? 'bg-success'"
             th:style="'width: ' + ${progress.percentage} + '%'"
             th:text="${progress.percentage} + '%'">0%
        </div>
    </div>
</div>

<form method="post" th:action="@{/goal/{slug}/save(slug=${goalSlug})}" th:object="${myForm}">

    <div class="mb-3">
        <label class="form-label fw-bold" th:text="#{goal.checklist}">Checklist</label>

        <div class="mb-2" th:each="option : ${allOptions}">
            <div class="form-check">
                <input class="form-check-input"
                       th:field="*{selectedOptions}"
                       th:id="'option-' + ${option.id}"
                       th:value="${option.id}"
                       type="checkbox"/>
                <label class="form-check-label"
                       th:for="'option-' + ${option.id}"
                       th:text="#{__${option.nameKey}__}">Option</label>
            </div>
            <div class="form-text ms-4"
                 th:if="${option.descKey != null}"
                 th:text="#{__${option.descKey}__}">Description
            </div>
        </div>
        <p class="text-muted" th:if="${#lists.isEmpty(allOptions)}" th:text="#{goal.empty}">No checklist items for this
            goal yet.</p>
    </div>

    <button class="btn btn-primary" th:text="#{common.save}" type="submit">Save</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
