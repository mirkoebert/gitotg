<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{error.title}">Error - Gitotg</title>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css" rel="stylesheet">
    <th:block th:insert="~{fragments/head :: favicons}"></th:block>
    <style>
        .error-image {
            max-width: 100%;
            height: auto;
            max-height: 420px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="container mt-3 mt-md-5">
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="text-center mt-5">
    <img src="/images/golf-hole-problem.jpg"
         th:alt="#{error.alt.hole}"
         class="error-image mb-4">

    <h1 class="display-5 mb-3" th:text="#{error.heading}">Problem on the Green</h1>
    <p class="lead text-muted mb-4" th:text="#{error.text}">Looks like the pin placement didn't quite go to plan.</p>

    <a th:href="@{/}" class="btn btn-primary" th:text="#{error.back}">Back to Home</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
